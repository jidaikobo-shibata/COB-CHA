<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">

  <script>
    // Embedding dictionaries and current languages ​​on the server
    window.I18N = <?!= JSON.stringify(getLangSet('ui')) ?> || {};
    window.LANG = <?!= JSON.stringify(getProp('lang')) ?> || 'en';
    document.documentElement.setAttribute('lang', window.LANG);
  </script>

  <script>
    /**
     * events
     */
    function preventFormSubmit() {
      var forms = document.querySelectorAll('form');
      for (var i = 0; i < forms.length; i++) {
        forms[i].addEventListener('submit', function(event) {
          event.preventDefault();
        });
      }
    }
    window.addEventListener('load', preventFormSubmit);
    
    /**
     * events
     */
    document.addEventListener('DOMContentLoaded', function() {
      // Localize
      applyI18n();

      // on load
      document.querySelectorAll('.progress-indicator').forEach(function(indicator) {
        indicator.style.display = 'none';
      });
      document.getElementById('progress-loading').style.display = '';

      // Judge Edit or Add before set default value
      requestAnimationFrame(function(){
        google.script.run
          .withSuccessHandler(
            function(ret) {
              setDefaultValue(ret);
            })
          .dialogValueIssue();
      });

      // on click
      document.getElementById('apply-issue').addEventListener('click', onApplyIssueClick);
      document.getElementById('all-page').addEventListener('click', function() {
        document.querySelectorAll('.places').forEach(function(place) {
          place.checked = true;
        });
      });

      // on change
      document.addEventListener('change', function(event) {
        if (event.target.matches('.criteria-chk')) changeCriteria();
      });
    });
    
    /**
     * set default value
     * @param {Object} ret
     */
    function setDefaultValue(ret) {
      // dialog title and button
      var applyButton = document.getElementById('apply-issue');
      var msg = ret['isEdit']
        ? t('update-issue', 'Update Issue')
        : t('add-new-issue', 'Add New Issue');
      applyButton.textContent = msg;

      var issueId = document.createElement('input');
      issueId.type = 'hidden';
      issueId.id = 'issue-id';
      issueId.value = ret.vals && ret.vals.issueId ? ret.vals.issueId : '';
      applyButton.after(issueId);

      // criteria
      var criteriaFragment = document.createDocumentFragment();
      for (var i = 0; i < ret['usingCriteria'].length; i++) {
        var criterion = ret['usingCriteria'][i][1];
        var exp = ret['usingCriteria'][i][2];
        var idname = criterion.replace(/\./g, '_') + '-criterion';

        var criteriaRow = document.createElement('tr');
        var criteriaInputCell = document.createElement('td');
        var criteriaLabelCell = document.createElement('td');
        var criteriaInput = document.createElement('input');
        var criteriaLabel = document.createElement('label');

        criteriaInput.type = 'checkbox';
        criteriaInput.className = 'criteria-chk';
        criteriaInput.id = idname;
        criteriaInput.value = criterion;
        criteriaLabel.htmlFor = idname;
        criteriaLabel.textContent = criterion+': '+exp;

        criteriaInputCell.append(criteriaInput);
        criteriaLabelCell.append(criteriaLabel);
        criteriaRow.append(criteriaInputCell, criteriaLabelCell);
        criteriaFragment.append(criteriaRow);
      }
      document.getElementById('criteria').replaceChildren(criteriaFragment);

      // techniques
      var techMap = Object.create(null);
      for (var j = 0; j < ret['usingTechs'].length; j++) {
        var c = ret['usingTechs'][j][0];
        (techMap[c] = techMap[c] || []).push(ret['usingTechs'][j]);
      }
      var techFragment = document.createDocumentFragment();
      for (var i = 0; i < ret['usingCriteria'].length; i++) {
        var criteria  = ret['usingCriteria'][i][1];
        var classname = criteria.replace(/\./g, '_');
        var techHeadingRow = document.createElement('tr');
        var techHeading = document.createElement('th');

        techHeadingRow.classList.add(classname, 'tech-row');
        techHeading.colSpan = 3;
        techHeading.textContent = criteria;
        techHeadingRow.append(techHeading);
        techFragment.append(techHeadingRow);

        var list = techMap[criteria] || [];
        for (var k = 0; k < list.length; k++) {
          var each   = list[k][1];
          var for_id = classname + '-' + list[k][1] + '-' + k; // ensure uniqueness across criteria
          var label  = list[k][2];

          var techRow = document.createElement('tr');
          var techInputCell = document.createElement('td');
          var techLabelCell = document.createElement('td');
          var techInput = document.createElement('input');
          var techLabel = document.createElement('label');

          techRow.classList.add(classname, 'tech-row');
          techInput.type = 'checkbox';
          techInput.id = for_id;
          techInput.value = each;
          techLabel.htmlFor = for_id;
          techLabel.textContent = each+': '+label;

          techInputCell.append(techInput);
          techLabelCell.append(techLabel);
          techRow.append(techInputCell, techLabelCell);
          techFragment.append(techRow);
        }
      }
      document.getElementById('techs').replaceChildren(techFragment);

      // places
      var placesFragment = document.createDocumentFragment();
      for (var i = 0; i < ret['allPlaces'].length; i++) {
        var place = ret['allPlaces'][i].url;
        var title = ret['allPlaces'][i].title;
        var idname = 'target-place-' + i;

        var placeRow = document.createElement('tr');
        var placeInputCell = document.createElement('td');
        var placeLabelCell = document.createElement('td');
        var placeLinkCell = document.createElement('td');
        var placeInput = document.createElement('input');
        var placeLabel = document.createElement('label');

        placeInput.type = 'checkbox';
        placeInput.id = idname;
        placeInput.className = 'places';
        placeInput.value = place;
        placeLabel.htmlFor = idname;
        placeLabel.textContent = title;

        placeInputCell.append(placeInput);
        placeLabelCell.append(placeLabel);

        if (/^https?:\/\/[^\s]+$/i.test(place)) {
          var placeLink = document.createElement('a');
          var svgNamespace = 'http://www.w3.org/2000/svg';
          var placeLinkIcon = document.createElementNS(svgNamespace, 'svg');
          var placeLinkBox = document.createElementNS(svgNamespace, 'path');
          var placeLinkArrow = document.createElementNS(svgNamespace, 'path');
          var placeLinkText = document.createElement('span');

          placeLink.href = place;
          placeLink.target = '_blank';
          placeLink.rel = 'noopener noreferrer';
          placeLinkIcon.setAttribute('class', 'external-link-icon');
          placeLinkIcon.setAttribute('viewBox', '0 0 24 24');
          placeLinkIcon.setAttribute('focusable', 'false');
          placeLinkIcon.setAttribute('aria-hidden', 'true');
          placeLinkBox.setAttribute(
            'd',
            'M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6'
          );
          placeLinkArrow.setAttribute('d', 'M14 3h7v7M10 14 21 3');
          placeLinkIcon.append(placeLinkBox, placeLinkArrow);
          placeLinkText.className = 'skip';
          placeLinkText.textContent = 'Open '+place;

          placeLink.append(placeLinkIcon, placeLinkText);
          placeLinkCell.append(placeLink);
        }

        placeRow.append(placeInputCell, placeLabelCell, placeLinkCell);
        placesFragment.append(placeRow);
      }
      document.getElementById('places').replaceChildren(placesFragment);

      // place: default
      var targetUrl = document.getElementById('target-url');
      var activeUrl = targetUrl ? targetUrl.value.toString().trim() : '';
      if (activeUrl) {
        document.querySelectorAll('input.places').forEach(function(place) {
          if (place.value === activeUrl) place.checked = true;
        });
      }

      // place: all
      if (typeof ret['vals']['places'] !== "undefined" && ret['vals']['places'] == 'all') {
        document.querySelectorAll('.places').forEach(function(place) {
          place.checked = true;
        });
      }
      
      // checkboxes
      (function restoreChecksFast(){
        var ids = ['testId','checked','techs','places'];
        var vset = new Set();
        for (var i = 0; i < ids.length; i++) {
          var v = ret.vals && ret.vals[ids[i]];
          if (!v) continue;
          String(v).split(',').forEach(function(x){ vset.add(x.trim()); });
        }
        document.querySelectorAll('input[type="checkbox"]').forEach(function(el){
          if (vset.has(el.value)) el.checked = true;
        });
      })();

      // Match the initial technique list to the restored criteria selection.
      changeCriteria();
                  
      if ( ! ret['isEdit']) {
        // loading end
        document.getElementById('progress-loading').style.display = 'none';
        return;
      }

      document.getElementById('issue-name').value = ret['vals']['issueName'];

      var textarea = ['html', 'memo', 'explanation'];
      for (var i = 0; i < textarea.length; i++) {
        document.getElementById(textarea[i]).value = ret['vals'][textarea[i]];
      }

      // select
      if (ret['vals']['errorNotice'] == 'Notice') {
        document.getElementById('error-notice').value = 'Notice';
      }

      // issue-solved
      if (ret['vals']['issueVisibility'] == 'on') {
        document.getElementById('issue-solved').checked = true;
      }

      // loading end
      requestAnimationFrame(function(){
        document.getElementById('progress-loading').style.display = 'none';
      });
    }

    /**
     * Apply Issue
     */
    function onApplyIssueClick() {
      var checked = Array.from(
        document.querySelectorAll('#criteria input:checked')
      ).map(function(input) {
        return input.value;
      });

      var techs = Array.from(
        document.querySelectorAll('#techs input:checked')
      ).map(function(input) {
        return input.value;
      });

      var places = Array.from(
        document.querySelectorAll('#places input:checked')
      ).map(function(input) {
        return input.value;
      });

      var issueVisibility = document.getElementById('issue-solved').checked ? 'on' : 'off';

      var vals = [
        document.getElementById('issue-id').value,
        document.getElementById('issue-name').value,
        issueVisibility,
        document.getElementById('error-notice').value,
        document.getElementById('html').value,
        document.getElementById('explanation').value,
        checked.join(','),
        techs.join(','),
        places.join(','),
        document.getElementById('memo').value
      ];

      runOnce(
        'apply-issue',
        'progress-loading',
        function(run){
          run
            .withSuccessHandler(function(msg) {
              run
                .withSuccessHandler(function(){ google.script.host.close(); })
                .withFailureHandler(function(){ /* keep dialog if alert fails */ })
                .showAlert(msg);
            })
            .withFailureHandler(function(err) {
              var m = (err && err.message) ? err.message : 'Failed to apply.';
              run.showAlert(m);
            })
            .applyIssue(vals);
        },
        12000 // optional timeout
      );
    }

    /**
     * Change Criteria
     */
    function changeCriteria() {
      var techniqueRows = document.querySelectorAll('#techs .tech-row');
      var checked = Array.from(
        document.querySelectorAll('.criteria-chk:checked')
      ).map(function(input) {
        return input.value.replace(/\./g, '_');
      });

      if (checked.length == 0) {
        techniqueRows.forEach(function(row) {
          row.style.display = '';
        });
      } else {
        techniqueRows.forEach(function(row) {
          row.style.display = checked.some(function(classname) {
            return row.classList.contains(classname);
          }) ? '' : 'none';
        });
      }
    }
  </script>
  <?!= HtmlService.createHtmlOutputFromFile('ui-common').getContent(); ?>
<body style="padding-bottom: 4em;">
  <input
    type="hidden"
    id="target-url"
    value="<?= TEMPLATE_VARS.targetUrl || '' ?>"
  >
  <table style="width:95%;">
  <tr>
    <th><label for="issue-name" id="issue-name-title" data-i18n="name">Name</label></th>
    <td><input type="text" id="issue-name" style="width:100%;"></td>
  </tr>
  <tr>
    <th><label for="error-notice">Error/Notice</label></th>
    <td>
      <select id="error-notice"><option value="Error">Error</option><option value="Notice">Notice</option></select>
      <span style="display: inline-block; margin-left: 1em;"><input type="checkbox" id="issue-solved"> <label for="issue-solved" id="issue-solved-title" data-i18n="issue-solved">Solved</label></span>
    </td>
  </tr>
  <tr>
    <th><label for="html">HTML</label></th>
    <td><textarea id="html" style="width:100%;height:100px;"></textarea></td>
  </tr>
  <tr>
    <th><label for="explanation" id="explanation-title" data-i18n="explanation">Explanation</label></th>
    <td><textarea id="explanation" style="width:100%;height:100px;"></textarea></td>
  </tr>
  <tr>
    <th data-i18n="criterion">Criteria</th>
    <td style="position:relative;height:150px;"><div style="position:absolute;top:0;height:160px;overflow:auto;overflow-x:hidden;padding:5px;width:100%;"><table id="criteria" style="width: 100%"></table></div></td>
  </tr>
  <tr>
    <th style="vertical-align: top;" id="tech-title" data-i18n="tech">Techniques</th>
    <td style="position:relative;height:150px;"><div style="position:absolute;top:0;height:160px;overflow:auto;overflow-x:hidden;padding:5px;width:100%;"><table id="techs" style="width: 100%"></table></div></td>
  </tr>
  <tr>
    <th><span id="places-title" data-i18n="places">Places</span><p><button type="button" id="all-page">Check All</button></p></th>
    <td style="position:relative;height:150px;"><div style="position:absolute;top:0;height:160px;overflow:auto;overflow-x:hidden;padding:5px;width:100%;"><table id="places" style="width: 100%"></table></div></td>
  </tr>
  <tr>
    <th><label for="memo" id="memo-title" data-i18n="memo">Memo</label></th>
    <td><textarea id="memo" style="width:100%;height:100px;"></textarea></td>
  </tr>
  </table>
  <div style="position: fixed; width: 100%; bottom: 0; background: #fff; z-index: 9; padding: 10px 0 10px;">
    <button id="apply-issue" class="primary" data-i18n="preparing">Preparing</button>
    <span role="status" aria-live="polite" class="progress-indicator" id="progress-loading"></span>
  </div>
</body>
</html>
