<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">

  <script>
    window.I18N = <?!= JSON.stringify(getLangSet('ui')) ?> || {};
    window.LANG = <?!= JSON.stringify(getProp('lang')) ?> || 'en';
    document.documentElement.setAttribute('lang', window.LANG);
  </script>

  <script>
    /**
     * events
     */
    document.addEventListener('DOMContentLoaded', function() {
      // localize
      applyI18n();

      // on click
      document.getElementById('set-additional-criteria')
        .addEventListener('click', onClickSetAdditionalCriteria);

      // default value
      setDefaultValue();

      // loading
      document.getElementById('progress-loading').style.display = 'none';
    });
    
    /**
     * set default value
     * @param bool isEdit
     */
    function setDefaultValue() {
      google.script.run
        .withSuccessHandler(
          function(ret) {
            var criteriaTable = document.getElementById('criteria');
            var fragment = document.createDocumentFragment();

            // generate table
            for(var i = 0; i < ret['criteria'].length; i++) {
              if (ret['type'] == 'wcag20' && (ret['criteria21'].indexOf(ret['criteria'][i][1]) >= 0 || ret['criteria22'].indexOf(ret['criteria'][i][1]) >= 0)) continue;
              if (ret['type'] == 'wcag21' && ret['criteria22'].indexOf(ret['criteria'][i][1]) >= 0) continue;
              if (ret['criteria'][i][0].length <= ret['level'].length) continue;

              var criterion = ret['criteria'][i][1];
              var exp = ret['criteria'][i][2];
              var idname = criterion.replace(/\./g, '_')+'-criterion';
              
              var row = document.createElement('tr');
              var inputCell = document.createElement('td');
              var labelCell = document.createElement('td');
              var input = document.createElement('input');
              var label = document.createElement('label');

              input.type = 'checkbox';
              input.className = 'criteria-chk';
              input.id = idname;
              input.value = criterion;
              label.htmlFor = idname;
              label.textContent = criterion+': '+exp;

              inputCell.append(input);
              labelCell.append(label);
              row.append(inputCell, labelCell);
              fragment.append(row);
            }

            criteriaTable.append(fragment);

            // revert value
            var checked = ret['checked'].split(/,/).map(function(value) {
              return value.trim();
            });
            criteriaTable.querySelectorAll('input[type="checkbox"]').forEach(function(input) {
              input.checked = checked.indexOf(input.value) !== -1;
            });
          })
        .dialogValueAdditionalCriteria();
    }

    /**
     * Set Additional Criteria
     */
    function onClickSetAdditionalCriteria() {
      runOnce(
        'set-additional-criteria',
        'progress-loading',
        function(run){
          var checked = Array.from(
            document.querySelectorAll('#criteria input:checked')
          ).map(function(input) {
            return input.value;
          });
          run
            .withSuccessHandler(function() {
              google.script.host.close();
            })
            .withFailureHandler(function(err) {
              var m = (err && err.message) ? err.message : 'Failed to apply.';
              run.showAlert(m);
            })
            .setAdditionalCriteria(checked.join(', '));
        },
        12000 // optional timeout
      );
    }
  </script>
  <?!= HtmlService.createHtmlOutputFromFile('ui-common').getContent(); ?>
</head>
<body style="padding-bottom: 4em;">
  <div style="position: fixed; width: 100%; bottom: 0; background: #fff; z-index: 9; padding: 20px;">
    <button id="set-additional-criteria" class="primary" data-i18n="set-additional-criteria">Set additional criteria</button>
    <span role="status" aria-live="polite" class="progress-indicator" id="progress-loading"></span>
  </div>
  <table id="criteria" style="width: calc(100% - 50px); margin: 0 0 20px 20px;"></table>
</body>
</html>
