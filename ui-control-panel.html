<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">

  <style>
    details[open] > :last-child {
      margin-bottom: 0;
    }
  </style>

  <script>
    window.I18N = <?!= JSON.stringify(getLangSet('ui')) ?> || {};
    window.LANG = <?!= JSON.stringify(getProp('lang')) ?> || 'en';
    document.documentElement.setAttribute('lang', window.LANG);
  </script>

  <script>
    /**
     * events
     */
    document.addEventListener('DOMContentLoaded', function() {
      // localize
      applyI18n();

      // version
      google.script.run
        .withSuccessHandler(
          function(version) {
            document.getElementById('cob-cha-version').textContent = version;
          })
        .getLangSet('version');

      // on load
      document.querySelectorAll('.progress-indicator').forEach(function(indicator) {
        indicator.style.display = 'none';
      });

      // on change
      document.getElementById('lang').addEventListener('change', switchLanguageStatus);
      document.getElementById('test-type').addEventListener('change', switchLevelWhenTtOrNot);
      document.getElementById('evaluate-level').addEventListener('change', switchAdditionalCriterion);

      // on click
      document.getElementById('generate-config-sheet').addEventListener('click', onClickGenerateConfig);
      document.getElementById('set-additional-criteria').addEventListener('click', onClickSetAdditionalCriteria);
      document.getElementById('generate-report').addEventListener('click', onClickCreateReport);
      document.getElementById('generate-sc-template-sheet').addEventListener('click', function() {
        onClickGenerateSheet('*SC Template', 'generate-sc-template-sheet');
      });
      document.getElementById('generate-icl-template-sheet').addEventListener('click', onClickGenarateIclTpl);
      document.getElementById('generate-each-record-sheets').addEventListener('click', function() {
        onClickGenerateSheet('*URLs', 'generate-each-record-sheets');
      });
      document.getElementById('generate-url-list-sheet').addEventListener('click', onClickGenarateUrlList);
      document.getElementById('apply-sc-template').addEventListener('click', onClickApplyScTemplate);
      document.getElementById('apply-icl-template').addEventListener('click', onClickApplyIclTemplate);
      document.getElementById('apply-conformance-to-all').addEventListener('click', onClickApplyConformanceToAll);
      document.getElementById('get-current-pos').addEventListener('click', onClickGetCurrentPos);
      document.getElementById('do-lump-edit').addEventListener('click', onClickDoLumpEdit);
      document.getElementById('add-edit-issue').addEventListener('click', onClickAddEditIssue);
      document.getElementById('show-issue').addEventListener('click', onClickShowIssue);
      document.getElementById('apply-target-icl-to-sc').addEventListener('click', onClickApplyTargetIclToSc);
      document.getElementById('evaluate-sc').addEventListener('click', onClickEvaluateSc);
      document.getElementById('evaluate-icl').addEventListener('click', onClickEvaluateIcl);
      document.getElementById('reset-all-sheets').addEventListener('click', function() {
        onClickResetSheets(true);
      });
      document.getElementById('reset-record-sheets').addEventListener('click', function() {
        onClickResetSheets(false);
      });

      // ICL (Japanese Only)
      google.script.run
        .withSuccessHandler(
          function(ret) {
            if (ret == 'ja') {
              document.getElementById('evaluate-icl').style.display = '';
              setIclTemplateVisibility(true);
            }
          })
        .getProp('lang');

      // default value
      setDefaultValue();
    });

    /**
     * set default value
     */
    function setDefaultValue() {
      var current = window.LANG || 'en';
      document.getElementById('lang').value = current;
      document.documentElement.setAttribute('lang', current);
      if (current !== 'ja') setIclTemplateVisibility(false);

      google.script.run
        .withSuccessHandler(
          function(ret) {
            document.getElementById('test-type').value = ret;

            // select level depend on test-type
            if (ret.indexOf('wcag') >= 0) {
              google.script.run
                .withSuccessHandler(
                  function(innerRet) {
                    document.getElementById('evaluate-level').value = innerRet;
                  })
                .getProp('level');
            } else {
              document.getElementById('evaluate-level').value = 'AA';
              document.getElementById('evaluate-level').disabled = true;
              document.getElementById('set-additional-criteria').disabled = true;
              setIclTemplateVisibility(false);
            }
          })
        .getProp('type');
        
        google.script.run
        .withSuccessHandler(
          function(ret) {
            if (ret[0] == 'NT') {
              document.getElementById('mark').value = 'tf';
            } else {
              document.getElementById('mark').value = 'ox';
            }
          })
        .getProp('mark');
        
        // ICL select
        google.script.run
        .withSuccessHandler(
          function(icl) {
            const ordered = {};
            Object.keys(icl).sort().forEach(function(key) {
              ordered[key] = icl[key];
            });

            for (var key in ordered) {
              var label = ordered[key]['label'];
              var option = document.createElement('option');
              option.value = key;
              option.textContent = label;
              document.getElementById('icl-template-set').append(option);
            }
          })
        .getLangSet('iclList');
    }

    /**
     * switch level value and status
     * Trusted Tester is fixed with AA
     */
    function switchLevelWhenTtOrNot() {
      if (document.getElementById('test-type').value.indexOf('tt') != -1) {
        setIclTemplateVisibility(false);
        document.getElementById('evaluate-level').value = 'AA';
        document.getElementById('evaluate-level').disabled = true;
        document.getElementById('set-additional-criteria').disabled = true;
      } else {
        setIclTemplateVisibility(true);
        document.getElementById('evaluate-level').disabled = false;
        document.getElementById('set-additional-criteria').disabled = false;
      }
    }

    function setIclTemplateVisibility(visible) {
      document.querySelectorAll('.icl-tpl').forEach(function(element) {
        element.style.display = visible ? '' : 'none';
      });
    }

    /**
     * switch language status
     */
    function switchLanguageStatus() {
      google.script.run
        .withSuccessHandler(
          function(lang) {
            document.getElementById('lang').value = lang;
          })
        .withFailureHandler(
          function(lang) {
            document.getElementById('lang').value = lang;
          })
        .forceUpdateLang(document.getElementById('lang').value);
    }

    /**
     * switch Additional Criterion status
     */
    function switchAdditionalCriterion() {
      document.getElementById('set-additional-criteria').disabled =
        document.getElementById('evaluate-level').value.indexOf('AAA') >= 0;
    }
    
    /**
     * Set Additional Criteria
     */
    function onClickSetAdditionalCriteria() {
      runOnce(
        'set-additional-criteria',
        'progress-set-additional-criteria',
        function(run){
          run.openDialogAdditionalCriteria(
            document.getElementById('lang').value,
            document.getElementById('test-type').value,
            document.getElementById('evaluate-level').value,
            document.getElementById('mark').value
          );
        },
        12000
      );
    }

    /**
     * generate Config Sheet
     */
    function onClickGenerateConfig() {
      progressIndicator('generate-config-sheet', 'progress-generate-config-sheet', true);

      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-config-sheet');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-config-sheet');
          })
        .generateConfigSheet(
          document.getElementById('lang').value,
          document.getElementById('test-type').value,
          document.getElementById('evaluate-level').value,
          document.getElementById('mark').value
        );
    }

    /**
     * Generate Url List Sheets
     */
    function onClickGenarateUrlList() {
      progressIndicator('generate-url-list-sheet', 'progress-generate-url-list-sheet', true);
      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-url-list-sheet');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-url-list-sheet');
          })
        .generateUrlListSheet();
    }

    /**
     * Generate Icl Template Sheets
     */
    function onClickGenarateIclTpl() {
      progressIndicator('generate-icl-template-sheet', 'progress-generate-icl-template-sheet', true);
      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-icl-template-sheet');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-icl-template-sheet');
          })
        .generateIclTplSheet(
          document.getElementById('icl-template-set').value,
          document.getElementById('test-type').value
        );
    }
    
    /**
     * apply sc template
     */
    function onClickApplyScTemplate() {
      progressIndicator('apply-sc-template', 'progress-apply-sc-template', true);

      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'apply-sc-template')
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'apply-sc-template')
          })
        .applyScTemplate();
    }
    
    /**
     * Apply Icl template
     */
    function onClickApplyIclTemplate() {
      progressIndicator('apply-icl-template', 'progress-apply-icl-template', true);
      
      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'apply-icl-template');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'apply-icl-template');
          })
        .applyIclTemplate();
    }

    /**
     * Generate Sheets
     * @param String sheets
     * @param String targetId
     */
    function onClickGenerateSheet(sheets, targetId) {
      progressIndicator(targetId, 'progress-'+targetId, true);

      google.script.run
        .withSuccessHandler(
          function(rets) {
            showStatusAndFin(rets['msg'], rets['targetId']);
          })
        .withFailureHandler(
          function(rets) {
            showStatusAndFin(rets['msg'], rets['targetId']);
          })
        .generateSheets(
          sheets,
          document.getElementById('lang').value,
          document.getElementById('test-type').value,
          document.getElementById('evaluate-level').value,
          targetId
        );
    }
    
    /**
     * Apply Comformance to all
     */
    function onClickApplyConformanceToAll() {
      progressIndicator('apply-conformance-to-all', 'progress-apply-conformance-to-all', true);

      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'apply-conformance-to-all')
          })
        .withFailureHandler(
          function() {
            showStatusAndFin('failed', 'apply-conformance-to-all');
          })
        .applyConformanceToAll();
    }
    
    /**
     * Apply Target ICL To Sc
     */
    function onClickApplyTargetIclToSc() {
      progressIndicator('apply-target-icl-to-sc', 'progress-apply-target-icl-to-sc', true);
      
      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'apply-target-icl-to-sc');
          })
        .withFailureHandler(
          function() {
            showStatusAndFin('failed', 'apply-target-icl-to-sc');
          })
        .doApplyTargetIclToSc();
    }

    /**
     * Get Current position
     */
    function onClickGetCurrentPos() {
      progressIndicator('get-current-pos', 'progress-get-current-pos', true);

      google.script.run
        .withSuccessHandler(
          function(pos) {
            document.getElementById('lump-pos-row').value = pos[0];
            document.getElementById('lump-pos-col').value = pos[1];
            document.getElementById('lump-val').value = pos[2];
            progressIndicator('get-current-pos', 'progress-get-current-pos', false);
          })
        .withFailureHandler(
          function() {
            showStatusAndFin('failed', 'get-current-pos');
          })
        .getCurrentPos();
    }

    /**
     * Do Lump Edit
     */
    function onClickDoLumpEdit() {
      var is_append = document.getElementById('lump-is_append').checked;

      runOnce(
        'do-lump-edit',
        'progress-do-lump-edit',
        function(run){
          run.openLumpEditDialog(
            document.getElementById('lump-pos-row').value,
            document.getElementById('lump-pos-col').value,
            document.getElementById('lump-val').value,
            is_append
          );
        },
        12000
      );
    }

    /**
     * Add Issue
     */
    function onClickAddEditIssue() {
      runOnce(
        'add-edit-issue',
        'progress-add-edit-issue',
        function(run){
          run.openDialogIssue();
        },
        12000
      );
    }

    /**
     * Show Issue
     */
    function onClickShowIssue() {
      runOnce(
        'show-issue',
        'progress-show-issue',
        function(run){
          run.showDialog('ui-issuelist', 500, 400, t('issue-list', 'Issue List'));
        },
        12000
      );
    }

    /**
     * create Report Sheet
     */
    function onClickCreateReport() {
      progressIndicator('generate-report', 'progress-generate-report', true);

      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-report');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'generate-report');
          })
        .generateReportSheet(document.getElementById('evaluate-level').value, '');
    }
    
    /**
     * Evaluate SC
     */
    function onClickEvaluateSc() {
      progressIndicator('evaluate-sc', 'progress-evaluate-sc', true);

      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'evaluate-sc');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'evaluate-sc');
          })
        .evaluateSc();
    }

    /**
     * Evaluate ICL
     */
    function onClickEvaluateIcl() {
      progressIndicator('evaluate-icl', 'progress-evaluate-icl', true);

      google.script.run
        .withSuccessHandler(
          function(msg) {
            showStatusAndFin(msg, 'evaluate-icl');
          })
        .withFailureHandler(
          function(msg) {
            showStatusAndFin(msg, 'evaluate-icl');
          })
        .evaluateIcl(
          document.getElementById('lang').value,
          document.getElementById('test-type').value,
          document.getElementById('evaluate-level').value
        );
    }

    /**
     * Reset sheets
     * @param Bool isAll
     */
    function onClickResetSheets(isAll) {
      var id = isAll ? 'reset-all-sheets' : 'reset-record-sheets';
      progressIndicator(id, 'progress-'+id, true);

      google.script.run
        .withSuccessHandler(
          function(ret) {
            showStatusAndFin(ret['msg'], ret['id']);
          })
        .withFailureHandler(
          function(ret) {
            showStatusAndFin(ret['msg'], ret['id']);
          })
        .resetSheets(isAll);
    }
  </script>

  <?!= HtmlService.createHtmlOutputFromFile('ui-common').getContent(); ?>
</head>

<body>
  <details id="config-details" open>
    <summary id="config-title" data-i18n="config-title">1. Config</summary>
    <p>
      <select id="lang" title="Language" style="width:3.5em;min-width:3.5em;">
        <option value="en">en</option>
        <option value="ja">ja</option>
      </select>
      <select id="test-type" title="Test Type" style="width:8em;min-width:8em;">
        <option value="wcag20">WCAG 2.0</option>
        <option value="wcag21">WCAG 2.1</option>
        <option value="wcag22">WCAG 2.2</option>
        <option value="tt20">Trusted Tester</option>
        <!--  <option value="tt21">Trusted Tester (WCAG 2.1)</option>-->
      </select>
      <select id="evaluate-level" title="Level" style="width:5em;min-width:5em;">
        <option value="A">A</option>
        <option value="AA">AA</option>
        <option value="AAA">AAA</option>
      </select>
      <select id="mark" title="Mark Type" style="width:4em;min-width:4em;">
        <option value="ox">o/x</option>
        <option value="tf">T/F</option>
      </select>
    </p>
    <p>
      <button id="generate-config-sheet" data-i18n="generate-config-sheet">Generate config sheet</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-generate-config-sheet"></span>
    </p>
    <p>
      <button id="set-additional-criteria" data-i18n="set-additional-criteria">Set additional criteria</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-set-additional-criteria"></span>
    </p>
  </details>
  
  <details>
    <summary id="target-urls-setting-title" data-i18n="target-urls-setting-title">2. Target URLs Setting</summary>
    <p>
      <button id="generate-url-list-sheet" data-i18n="generate-url-list-sheet">Generate url list sheet</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-generate-url-list-sheet"></span>
    </p>
    <p>
      <button id="generate-each-record-sheets" data-i18n="generate-each-record-sheets">Generate each record sheets</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-generate-each-record-sheets"></span>
    </p>
  </details>
  
  <details>
    <summary id="use-template-title" data-i18n="use-template-title">3. Use Template</summary>
    <fieldset>
      <legend id="success-criteria" data-i18n="criterion">Success Criteria</legend>
      <p style="margin-top:-5px;">
        <button id="generate-sc-template-sheet" data-i18n="generate-sc-template-sheet">Generate SC template</button>
        <span role="status" aria-live="polite" class="progress-indicator" id="progress-generate-sc-template-sheet"></span>
      </p>
      <p>
        <button id="apply-sc-template" data-i18n="apply-sc-template">Apply all</button>
        <span role="status" aria-live="polite" class="progress-indicator" id="progress-apply-sc-template"></span>
      </p>
    </fieldset>
    <fieldset class="icl-tpl">
      <legend><label for="icl-template-set" id="select-icl-template-set" data-i18n="tech">Select ICL template</label></legend>
      <select id="icl-template-set" style="margin-bottom: 1em;">
      </select>
      <button id="generate-icl-template-sheet" data-i18n="generate-icl-template-sheet">Generate ICL template</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-generate-icl-template-sheet"></span>
      <p class="icl-tpl">
        <button id="apply-icl-template" data-i18n="apply-icl-template">Apply ICL Sheet</button>
        <span role="status" aria-live="polite" class="progress-indicator" id="progress-apply-icl-template"></span>
      </p>
    </fieldset>
  </details>
   
  <details>
    <summary id="edit-value-title" data-i18n="edit-value-title">4. Edit Value</summary>
    <fieldset>
      <legend id="current-sheet" data-i18n="current-sheet">Current Sheet</legend>
      <p style="margin:0;padding:0;lin-height:1;">
        <button id="apply-conformance-to-all" data-i18n="apply-conformance-to-all">Apply conformance to all</button>
        <span role="status" aria-live="polite" class="progress-indicator" id="progress-apply-conformance-to-all"></span>
      </p>
    </fieldset>
    <fieldset>
      <legend id="lump-edit" data-i18n="lump-edit">Lump Edit</legend>
      <p style="margin-top:-5px;">
        <label for="lump-pos-row" id="label-lump-pos-row" data-i18n="pos-row">X</label>: <input type="text" size="2" id="lump-pos-row">
        <label for="lump-pos-col" id="label-lump-pos-col" data-i18n="pos-col">Y</label>: <input type="text" size="2" id="lump-pos-col">
        <label for="lump-val" id="label-lump-val" data-i18n="value">Val</label>: <input type="text" size="5" id="lump-val">
        <input type="checkbox" id="lump-is_append" checked="checked"> <label for="lump-is_append" id="label-lump-is_append" data-i18n="lump-is_append">Append not overwrite</label>
        <span role="status" aria-live="polite" class="progress-indicator" id="progress-get-current-pos"></span>
        <span role="status" aria-live="polite" class="progress-indicator" id="progress-do-lump-edit"></span>
      </p>
      <button id="get-current-pos" data-i18n="get-current-pos">Get Current Position</button>
      <button id="do-lump-edit" data-i18n="do-lump-edit">Apply</button>
    </fieldset>
  </details>
  
  <details>
    <summary id="issue-control-title" data-i18n="issue-control-title">5. Issue Control</summary>
    <p>
      <button id="add-edit-issue" data-i18n="add-edit-issue">Add/Edit Issue</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-add-edit-issue"></span>
    </p>
    <p>
      <button id="show-issue" data-i18n="show-issue">Show Issue</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-show-issue"></span>
    </p>
  </details>
    
  <details>
    <summary id="evaluate-title" data-i18n="evaluate-title">6. Evaluate</summary>
    <p class="icl-tpl">
      <button id="apply-target-icl-to-sc" data-i18n="apply-target-icl-to-sc">ICL to SC at Target page</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-apply-target-icl-to-sc"></span>
    </p>
    <p>
      <button id="evaluate-sc" data-i18n="evaluate-sc">Evaluate</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-evaluate-sc"></span>
    </p>
    <p class="icl-tpl">
      <button id="evaluate-icl" data-i18n="evaluate-icl">Evaluate ICL</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-evaluate-icl"></span>
    </p>
  </details>
  
  <details>
    <summary id="etc-title" data-i18n="etc-title">ETC.</summary>
    <p>
      <button id="generate-report" data-i18n="generate-report">Create Report Sheet</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-generate-report"></span>
    </p>
    <p>
      <button id="reset-record-sheets" data-i18n="reset-record-sheets">Reset Record Sheet</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-reset-record-sheets"></span>
    </p>
    <p>
      <button id="reset-all-sheets" data-i18n="reset-all-sheets">Reset All</button>
      <span role="status" aria-live="polite" class="progress-indicator" id="progress-reset-all-sheets"></span>
    </p>
  </details>
  <p style="text-align:right;">COB-CHA version: <span id="cob-cha-version">--</span></p>
</body>

</html>
