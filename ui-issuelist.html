<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">

  <script>
    // Embedding dictionaries and current languages ​​on the server
    window.I18N = <?!= JSON.stringify(getLangSet('ui')) ?> || {};
    window.LANG = <?!= JSON.stringify(getProp('lang')) ?> || 'en';
    document.documentElement.setAttribute('lang', window.LANG);
  </script>

  <script>
    /**
     * events
     */
    document.addEventListener('DOMContentLoaded', function() {
      google.script.run
        .withSuccessHandler(
          function(vals) {
            var heading = document.querySelector('h1');
            if (vals['url'] == '') {
              heading.textContent = t('no-target-url-found','no target url found');
            } else {
              heading.textContent = vals['url'];
              if (vals['issues'].length == 0) {
                var message = document.createElement('p');
                message.textContent = t('no-issue-found','no issue found');
                heading.after(message);
              } else {
                var issues = document.getElementById('issues');
                for (var i = 0; i < vals['issues'].length; i++) {
                  var row = parseInt(vals['issues'][i][0]) + 1;
                  var item = document.createElement('li');
                  var link = document.createElement('a');
                  link.href = '#';
                  link.dataset.issueRow = row;
                  link.textContent = vals['issues'][i][0]+': '+vals['issues'][i][1];
                  item.append(link);
                  issues.append(item);
                }
              }
            }
          })
        .setIssueList();

      document.getElementById('issues').addEventListener('click', function(event) {
        var link = event.target.closest('a[data-issue-row]');
        if (!link) return;
        event.preventDefault();
        google.script.run.showEachIssue(link.dataset.issueRow);
      });
    });
  </script>
  <?!= HtmlService.createHtmlOutputFromFile('ui-common').getContent(); ?>
</head>
<body>
  <h1><span role="status" aria-live="polite" class="progress-indicator" id="progress-loading"></span></h1>
  <ul id="issues">
  </ul>
</body>
</html>
