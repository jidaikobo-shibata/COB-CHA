<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">

  <script>
    /**
     * Inject dictionaries from server-side
     */
    window.I18N = <?!= JSON.stringify(getLangSet('ui')) ?> || {};
    window.LANG = <?!= JSON.stringify(getProp('lang')) ?> || 'en';
    document.documentElement.setAttribute('lang', window.LANG);

    /**
     * On load: localize and load header list for select
     */
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.progress-indicator').forEach(function(indicator) {
        indicator.style.display = 'none';
      });
      document.getElementById('progress-loading').style.display = '';

      // Apply i18n
      applyI18n();

      // Load header list from URL sheet
      google.script.run
        .withSuccessHandler(function(list) {
          var select = document.getElementById('lump-filter');
          list.forEach(function(item) {
            var text = item.header + " (" + item.count + ")";
            var option = document.createElement('option');
            option.value = item.header;
            option.textContent = text;
            select.append(option);
          });
          document.getElementById('progress-loading').style.display = 'none';
        })
        .getUrlSheetHeadersWithCount();
    });

    /**
     * Execute Lump Edit
     * Reads hidden fields passed from GAS openLumpEditDialog()
     */
    function runLumpEdit() {
      progressIndicator('do-lump-edit', 'progress-do-lump-edit', true);

      var filterKey = document.getElementById('lump-filter').value;

      var row       = document.getElementById('lump-pos-row').value;
      var col       = document.getElementById('lump-pos-col').value;
      var vals      = document.getElementById('lump-val').value;
      var is_append = document.getElementById('lump-is_append').value == '1';

      google.script.run
        .withSuccessHandler(function(msg) {
          google.script.run
            .withSuccessHandler(function() {
              google.script.host.close();
            })
            .withFailureHandler(function() {
              google.script.host.close();
            })
            .showAlert(msg, 'do-lump-edit');
        })
        .withFailureHandler(function() {
          showStatusAndFin('Failed', 'do-lump-edit');
        })
        .doLumpEditWithFilter(row, col, vals, is_append, filterKey);
    }
  </script>

  <!-- Common UI parts -->
  <?!= HtmlService.createHtmlOutputFromFile('ui-common').getContent(); ?>

</head>

<body>

<input type="hidden" id="lump-pos-row" value="<?= TEMPLATE_VARS.row ?>">
<input type="hidden" id="lump-pos-col" value="<?= TEMPLATE_VARS.col ?>">
<input type="hidden" id="lump-val" value="<?= TEMPLATE_VARS.vals ?>">
<input
  type="hidden"
  id="lump-is_append"
  value="<?= TEMPLATE_VARS.isAppend ?>"
>

<h2><label for="lump-filter" data-i18n="choose-target-condition">Choose target condition:</label>  <span role="status" aria-live="polite" class="progress-indicator" id="progress-loading"></span></h2>

<div>
<select id="lump-filter" style="width: 100%; text-align: left;">
  <!-- Options will be inserted dynamically -->
</select>
</div>

<div style="margin-top: 20px;">
  <button class="action" onclick="runLumpEdit()" data-i18n="do-lump-edit">Do lump edit</button> <span role="status" aria-live="polite" class="progress-indicator" id="progress-do-lump-edit"></span>
</div>

</body>
</html>
